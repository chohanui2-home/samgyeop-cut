<style>
:root{
  --ink:#4a2a1a; --ink-soft:#9a6a4f; --coral:#ff7b47; --coral-deep:#f0522d; --coral-dark:#c93f1e;
  --cream:#fff8f1; --butter:#ffe9c9; --wood:#cf8c50; --wood-dark:#96612f;
  --meat:#f4737f; --fat:#fbe3c6; --line:#f6ddc6; --ok:#2f9e6b; --warn:#d98324;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(760px 380px at 50% -8%, #ffffff 0%, rgba(255,255,255,0) 62%),
    radial-gradient(520px 340px at 104% 10%, rgba(255,196,146,.42) 0%, rgba(255,196,146,0) 72%),
    radial-gradient(480px 320px at -6% 26%, rgba(255,222,190,.55) 0%, rgba(255,222,190,0) 74%),
    linear-gradient(180deg,#fff8f1 0%, #ffeedd 52%, #fff6ec 100%);
  -webkit-text-size-adjust:100%;overflow-x:hidden;touch-action:manipulation;
}
button{font-family:inherit;cursor:pointer}
.app{
  position:relative;z-index:1;max-width:480px;margin:0 auto;
  padding:calc(6px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom));
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
}
/* ---------- header ---------- */
.topbar{display:flex;align-items:center;gap:6px;padding:3px 0 7px}
.topbar h1{
  margin:0;flex:1 1 auto;min-width:0;text-align:center;white-space:nowrap;
  font-size:clamp(19px,5.9vw,25px);font-weight:900;line-height:1.2;letter-spacing:-.05em;
  color:#c93f1e;text-shadow:0 1px 0 #fff,0 2px 0 rgba(255,255,255,.85),0 6px 14px rgba(240,82,45,.24);
}
.topbar h1 .emo{font-size:.94em;padding-right:.12em;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12))}
.iconbtn{
  width:36px;height:36px;flex:0 0 auto;border-radius:12px;border:none;background:#fff;
  box-shadow:0 4px 12px rgba(201,107,63,.20);color:#d4602f;display:grid;place-items:center;padding:0;
}
.iconbtn.off{color:#b9a191}
.iconbtn svg{width:20px;height:20px;display:block}
/* ---------- hud ---------- */
.hud{display:flex;gap:6px;margin:2px 0 7px}
.hudCell{
  flex:1 1 0;min-width:0;background:#fffdfa;border:1.5px solid var(--line);border-radius:13px;
  padding:5px 4px 6px;text-align:center;box-shadow:0 3px 9px rgba(196,124,74,.10);
}
.hudK{display:block;font-size:10.5px;font-weight:700;color:var(--ink-soft);letter-spacing:-.02em}
.hudCell b{display:block;font-size:15px;font-weight:900;color:#b23f1d;letter-spacing:-.04em;margin-top:1px}
.dots{display:flex;gap:5px;justify-content:center;margin:0 0 7px}
.dots i{width:100%;max-width:44px;height:7px;border-radius:99px;background:#f3e2d2;display:block}
.dots i.done{background:linear-gradient(180deg,#ffb27a,#ff7b47)}
.dots i.now{background:#ffd0ac;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #ffb585}
/* ---------- stage ---------- */
.stage{display:flex;align-items:flex-end;gap:2px;margin:0 0 6px}
.mascot{flex:0 0 auto;display:block;overflow:visible}
.mascot.pig{width:64px;height:64px}
.mascot.scissors{width:52px;height:52px;margin-bottom:4px}
.mascot .face{display:none}
[data-mood="idle"] .face-idle{display:block}
[data-mood="aim"] .face-aim{display:block}
[data-mood="cheer"] .face-cheer{display:block}
[data-mood="sad"] .face-sad{display:block}
.bubble{
  flex:1 1 auto;min-width:0;position:relative;background:#fffdf8;border:2px solid #ffd7b6;
  border-radius:14px;padding:7px 10px;font-size:12.5px;font-weight:800;line-height:1.3;
  color:#a2461f;letter-spacing:-.03em;box-shadow:0 4px 10px rgba(210,140,90,.14);
  margin:0 0 6px 4px;
}
.bubble::after{
  content:"";position:absolute;left:-7px;bottom:12px;width:11px;height:11px;background:#fffdf8;
  border-left:2px solid #ffd7b6;border-bottom:2px solid #ffd7b6;transform:rotate(45deg);
}
/* ---------- order card ---------- */
.orderCard{
  background:linear-gradient(150deg,#fff3e3 0%,#fffaf4 58%,#fff1e0 100%);
  border:2px solid #ffd9ba;border-radius:16px;padding:8px 11px 9px;margin-bottom:8px;
  box-shadow:0 5px 14px rgba(206,132,80,.13);
}
.orderK{
  display:inline-block;font-size:10.5px;font-weight:900;color:#fff;letter-spacing:-.02em;
  background:linear-gradient(180deg,#ff9a63,#f0522d);border-radius:99px;padding:2px 8px;
  box-shadow:0 2px 5px rgba(240,82,45,.28);
}
.orderTxt{font-size:14.5px;font-weight:800;line-height:1.32;margin-top:5px;letter-spacing:-.04em;color:#4a2a1a}
.orderTxt em{font-style:normal;color:#e0451f;font-weight:900}
/* ---------- board ---------- */
.board{
  position:relative;border-radius:18px;background:linear-gradient(180deg,#fff4e4,#ffe9d0);
  padding:5px;border:2px solid #f3dcc2;box-shadow:inset 0 2px 8px rgba(190,120,70,.10),0 8px 18px rgba(196,124,74,.14);
  touch-action:none;user-select:none;-webkit-user-select:none;
}
.board svg{display:block;width:100%;height:auto}
/* ---------- controls ---------- */
.controls{margin-top:8px}
.chipsWrap{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 6px;scrollbar-width:none}
.chipsWrap::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:2px solid #ffd3b4;background:#fffdf9;color:#b2562c;border-radius:99px;
  padding:6px 12px;font-size:12.5px;font-weight:900;letter-spacing:-.03em;
  box-shadow:0 2px 0 #ffe6d0;
}
.chip.on{background:linear-gradient(180deg,#ff9360,#f0522d);border-color:#e0451f;color:#fff;box-shadow:0 3px 0 #c93f1e}
.fineRow{display:flex;align-items:center;gap:8px;padding:2px 2px 0}
.fineRow .lbl{font-size:11px;font-weight:900;color:#a4643f;flex:0 0 auto;min-width:44px;text-align:right}
#fine{
  -webkit-appearance:none;appearance:none;flex:1 1 auto;height:22px;background:transparent;margin:0;
}
#fine::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,#ffd8bd,#ffb184);border:1px solid #f2c4a3}
#fine::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;border-radius:50%;margin-top:-10px;
  background:radial-gradient(circle at 34% 30%,#fff 0%,#ffb188 42%,#ef5a2f 100%);
  border:2px solid #fff;box-shadow:0 3px 8px rgba(214,86,40,.42);
}
#fine::-moz-range-track{height:8px;border-radius:99px;background:#ffcbaa}
#fine::-moz-range-thumb{width:24px;height:24px;border:2px solid #fff;border-radius:50%;background:#ef5a2f}
.cutBtn{
  display:block;width:100%;margin-top:9px;border:none;border-radius:16px;padding:14px 10px;
  font-size:17px;font-weight:900;letter-spacing:-.04em;color:#fff;
  background:linear-gradient(180deg,#ff9866 0%,#f0522d 62%,#d8401d 100%);
  box-shadow:0 6px 0 #b93a1a,0 10px 20px rgba(214,86,40,.32);
  transition:transform .08s ease,box-shadow .08s ease;
}
.cutBtn:active{transform:translateY(3px);box-shadow:0 3px 0 #b93a1a,0 6px 12px rgba(214,86,40,.28)}
.cutBtn[disabled]{opacity:.5}
/* ---------- reveal ---------- */
.rv{margin-top:9px;border-radius:18px;padding:11px 12px 12px;border:2px solid #ffd7b6;background:#fffdf9;
  box-shadow:0 8px 20px rgba(196,124,74,.16);animation:rvIn .3s ease-out both}
.rv.master{border-color:#ffd76b;background:linear-gradient(165deg,#fffaea,#fff6d9)}
.rv.boss{border-color:#ffb073;background:linear-gradient(165deg,#fff6ec,#ffeada)}
.rv.gold{border-color:#cfe0ff;background:linear-gradient(165deg,#f8fbff,#eef5ff)}
.rv.pig{border-color:#e6d5c6;background:linear-gradient(165deg,#fbf6f1,#f6ece2)}
@keyframes rvIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.rvTop{display:flex;align-items:center;justify-content:space-between;gap:6px}
.rvErr{font-size:19px;font-weight:900;color:#c93f1e;letter-spacing:-.05em}
.rvScore{font-size:17px;font-weight:900;color:#0f8a5b;letter-spacing:-.04em}
.rvWeights{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 0}
.pw{
  display:inline-flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #ffd9be;
  border-radius:99px;padding:3px 9px 3px 5px;font-size:13px;font-weight:900;color:#8c3a1d;
  box-shadow:0 2px 5px rgba(200,130,85,.12);
}
.pw b{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#ffb08b;color:#fff;font-size:10px}
.rvMath{font-size:11.5px;font-weight:700;color:#9a6a4f;margin-top:6px;letter-spacing:-.02em}
.rvGrade{font-size:15.5px;font-weight:900;margin-top:7px;color:#b23f1d;letter-spacing:-.04em}
.rvSum{font-size:11px;font-weight:700;color:#2f9e6b;margin-top:4px}
.nextBtn{
  display:block;width:100%;margin-top:10px;border:none;border-radius:14px;padding:13px 10px;
  font-size:16px;font-weight:900;color:#fff;letter-spacing:-.04em;
  background:linear-gradient(180deg,#63c48f 0%,#2f9e6b 100%);box-shadow:0 5px 0 #1e7d52,0 9px 18px rgba(32,130,88,.28);
}
.nextBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #1e7d52}
/* ---------- result ---------- */
.result{padding-top:4px}
.resCard{background:#fffdf9;border:2px solid #ffd7b6;border-radius:20px;padding:14px 14px 15px;box-shadow:0 10px 26px rgba(196,124,74,.18)}
.resTop{text-align:center;font-size:12.5px;font-weight:900;color:#c97a4a;letter-spacing:.02em}
.resStars{text-align:center;font-size:31px;letter-spacing:2px;margin:2px 0 0;color:#e6d7c9}
.resStars .on{color:#ffb019;text-shadow:0 2px 0 #fff,0 4px 10px rgba(255,176,25,.42)}
.resGrade{text-align:center;font-size:20px;font-weight:900;color:#b23f1d;letter-spacing:-.05em;margin-top:2px}
.resScore{text-align:center;margin:5px 0 2px}
.resScore b{font-size:36px;font-weight:900;color:#e0451f;letter-spacing:-.05em}
.resScore span{font-size:14px;font-weight:900;color:#b2562c;margin-left:2px}
.resBest{text-align:center;font-size:11.5px;font-weight:800;color:#9a6a4f;min-height:15px}
.resBest.new{color:#0f8a5b}
.resRows{margin:9px 0 0;border-top:1.5px dashed #f0ddc9;padding-top:7px}
.rRow{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12.5px;font-weight:700;color:#7a4a2e}
.rRow i{flex:0 0 17px;font-style:normal;font-weight:900;color:#c97a4a;font-size:11px}
.rRow .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.03em}
.rRow .er{flex:0 0 auto;font-weight:900;color:#b23f1d}
.rRow .pt{flex:0 0 44px;text-align:right;font-weight:900;color:#0f8a5b}
.resBtns{display:flex;gap:8px;margin-top:12px}
.btn{
  flex:1 1 0;border:none;border-radius:14px;padding:12px 8px;font-size:14px;font-weight:900;letter-spacing:-.04em;
  color:#fff;background:linear-gradient(180deg,#ff9866,#f0522d);box-shadow:0 5px 0 #b93a1a;
}
.btn.ghost{background:#fff5ea;color:#b2562c;box-shadow:0 5px 0 #f2ddc7;border:1.5px solid #ffd9be}

<script>
(function () {
  'use strict';

  var TITLE = '내가 정육왕';
  var STORE = 'naeJeongYukwang.v1';
  var MIN_GAP = 5;            /* % of the slab length kept between two scissors lines */
  var TOTAL_MIN = 300, TOTAL_MAX = 600;
  var VB_W = 360, VB_H = 212;
  var MEAT_X0 = 26, MEAT_X1 = 334, MEAT_CY = 104, MEAT_H = 92;
  var CUM_N = 400;
  var DMAX = 1.7;

  function $(id) { return document.getElementById(id); }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function sum(list) { var s = 0, i; for (i = 0; i < list.length; i++) { s += list[i]; } return s; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /* ---------- rng (seedable so the rules can be tested) ---------- */
  var rngState = 1;
  function seedRng(s) { rngState = (s >>> 0) || 1; }
  function rnd() {
    rngState = (rngState + 0x6D2B79F5) >>> 0;
    var t = rngState;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  /* ---------- meat thickness profiles ----------
     A problem's cut is scored by real weight, and weight follows the area of the
     slab. dens(x) is the g-per-unit-length of the strip at x (0..1). Uniform
     meat has dens(x)=1; the irregular slabs are thick on one end and thin on the
     other, with a gentle bump, so half the LENGTH is not half the WEIGHT. */
  var IRREG = [
    { name: '왼쪽 두꺼운 고기',
      f: function (x) { return (0.40 + 1.02 * (1 - x)) * (1 + 0.13 * Math.sin(2 * Math.PI * 1.5 * x + 0.6)); } },
    { name: '오른쪽 두꺼운 고기',
      f: function (x) { return (0.40 + 1.02 * x) * (1 + 0.12 * Math.sin(2 * Math.PI * 1.25 * x + 1.9)); } },
    { name: '가운데 볼록한 고기',
      f: function (x) { return (0.52 + 0.98 * Math.abs(Math.cos(Math.PI * x))) * (1 + 0.10 * Math.sin(2 * Math.PI * 2 * x + 0.4)); } }
  ];

  function dens(spec, x) {
    if (!spec || spec.irr === null || spec.irr === undefined || spec.irr < 0) { return 1; }
    var v = IRREG[spec.irr].f(clamp(x, 0, 1));
    return v > 0.08 ? v : 0.08;
  }

  /* find the thickest strip so the drawing can be scaled to the board */
  function computeDmax() {
    var best = 1, i, k, x;
    for (k = 0; k < IRREG.length; k++) {
      for (i = 0; i <= 200; i++) {
        x = i / 200;
        if (IRREG[k].f(x) > best) { best = IRREG[k].f(x); }
      }
    }
    return best * 1.02;
  }
  DMAX = computeDmax();

  /* cumulative mass table: cum[i] = share of the slab's weight left of i/CUM_N */
  function buildCum(spec) {
    var cum = [0], i, prev = dens(spec, 0), cur, s = 0, h = 1 / CUM_N, tot;
    for (i = 1; i <= CUM_N; i++) {
      cur = dens(spec, i * h);
      s += (prev + cur) * 0.5 * h;
      cum.push(s);
      prev = cur;
    }
    tot = cum[CUM_N] || 1;
    for (i = 0; i <= CUM_N; i++) { cum[i] = cum[i] / tot; }
    return cum;
  }
  function F(spec, x) {
    if (x <= 0) { return 0; }
    if (x >= 1) { return 1; }
    var p = x * CUM_N, i = Math.floor(p), f = p - i, c = spec.cum;
    return c[i] + (c[i + 1] - c[i]) * f;
  }

  /* every problem keeps its piece weights summing to the exact total */
  function roundToTotal(raw, total) {
    var floors = [], fracs = [], i, s = 0, rem, k, hi;
    for (i = 0; i < raw.length; i++) {
      floors.push(Math.floor(raw[i]));
      fracs.push({ i: i, f: raw[i] - Math.floor(raw[i]) });
      s += Math.floor(raw[i]);
    }
    rem = total - s;
    fracs.sort(function (a, b) { return b.f - a.f || a.i - b.i; });
    k = 0;
    while (rem > 0) { floors[fracs[k % fracs.length].i] += 1; rem -= 1; k += 1; }
    while (rem < 0) {
      hi = 0;
      for (i = 1; i < floors.length; i++) { if (floors[i] > floors[hi]) { hi = i; } }
      floors[hi] -= 1;
      rem += 1;
    }
    return floors;
  }

  function weightsFor(spec, cuts) {
    var edges = [0], i, a, b, m, raw = [];
    for (i = 0; i < cuts.length; i++) { edges.push(cuts[i] / 100); }
    edges.push(1);
    for (i = 0; i < edges.length - 1; i++) {
      a = edges[i]; b = edges[i + 1];
      m = (F(spec, b) - F(spec, a)) * spec.total;
      raw.push(m > 0 ? m : 0);
    }
    return roundToTotal(raw, spec.total);
  }

  /* x where the weight from the left edge equals the target weight */
  function targetFrac(spec) {
    var want = spec.target / spec.total, lo = 0, hi = 1, mid, i;
    for (i = 0; i < 48; i++) {
      mid = (lo + hi) / 2;
      if (F(spec, mid) < want) { lo = mid; } else { hi = mid; }
    }
    return (lo + hi) / 2;
  }

  function answerCuts(spec) {
    var out = [], i;
    if (spec.equal) {
      for (i = 1; i < spec.pieces; i++) { out.push(100 * i / spec.pieces); }
    } else {
      out.push(targetFrac(spec) * 100);
    }
    return out;
  }

  /* ---------- levels ---------- */
  var KINDS = {
    half:    { pieces: 2, equal: true,  irregular: false, name: '반띵' },
    weigh:   { pieces: 2, equal: false, irregular: false, name: '1인분 정량' },
    three:   { pieces: 3, equal: true,  irregular: false, name: '3팩 소분' },
    four:    { pieces: 4, equal: true,  irregular: false, name: '4팩 소분' },
    five:    { pieces: 5, equal: true,  irregular: false, name: '5팩 소분' },
    six:     { pieces: 6, equal: true,  irregular: false, name: '6팩 소분' },
    irweigh: { pieces: 2, equal: false, irregular: true,  name: '비정형 정량' },
    irhalf:  { pieces: 2, equal: true,  irregular: true,  name: '비정형 반띵' }
  };

  var LEVELS = [
    { id: 1, name: '반띵', short: '반띵', kinds: ['half'], random: false,
      tip: '균일한 통삼겹을 딱 절반으로!' },
    { id: 2, name: '1인분', short: '1인분', kinds: ['weigh'], random: false,
      tip: '목표 무게만큼 왼쪽부터 잘라 내기!' },
    { id: 3, name: '3팩 소분', short: '3팩', kinds: ['three'], random: false,
      tip: '가위 선 2개로 똑같이 3조각!' },
    { id: 4, name: '4팩 소분', short: '4팩', kinds: ['four'], random: false,
      tip: '가위 선 3개로 똑같이 4조각!' },
    { id: 5, name: '모양 다른 고기', short: '모양', kinds: ['irweigh', 'irhalf'], random: false,
      tip: '두께가 달라도 무게로 승부!' },
    { id: 6, name: '정육왕 주문', short: '정육왕',
      kinds: ['half', 'weigh', 'three', 'four', 'five', 'six', 'irweigh', 'irhalf'], random: true,
      tip: '오늘의 주문이 마구 들어와요!' }
  ];
  var PROBLEMS = 5;
  var TARGETS = [150, 180, 200, 220, 250];

  function pickKind(pool, prev) {
    var opts = [], i;
    for (i = 0; i < pool.length; i++) { if (pool[i] !== prev) { opts.push(pool[i]); } }
    if (!opts.length) { opts = pool.slice(); }
    return opts[Math.floor(rnd() * opts.length)];
  }

  function makeSpec(level, idx, prevKind, used) {
    var kind, i, pool, fresh;
    if (level.random) {
      pool = level.kinds;
      if (idx >= 3) {
        fresh = [];
        for (i = 0; i < level.kinds.length; i++) {
          if (!(used && used[level.kinds[i]]) && level.kinds[i] !== prevKind) { fresh.push(level.kinds[i]); }
        }
        if (fresh.length) { pool = fresh; }
      }
      kind = pickKind(pool, prevKind);
    } else {
      kind = level.kinds[idx % level.kinds.length];
    }
    var K = KINDS[kind];
    var total = TOTAL_MIN + Math.floor(rnd() * (TOTAL_MAX - TOTAL_MIN + 1));
    var irr = -1;
    if (K.irregular) { irr = Math.floor(rnd() * IRREG.length) % IRREG.length; }
    var target = 0;
    if (!K.equal) {
      var cands = [];
      for (i = 0; i < TARGETS.length; i++) {
        var ratio = TARGETS[i] / total;
        if (ratio >= 0.22 && ratio <= 0.66) { cands.push(TARGETS[i]); }
      }
      if (cands.length) {
        target = cands[Math.floor(rnd() * cands.length)];
      } else {
        target = Math.round(total * 0.4 / 10) * 10;
      }
    }
    var spec = { kind: kind, pieces: K.pieces, equal: K.equal, irr: irr, total: total, target: target };
    spec.cum = buildCum(spec);
    return spec;
  }

  function orderText(spec) {
    var n = spec.pieces;
    if (spec.kind === 'half') { return '정확히 <em>반띵</em>! 두 조각 무게가 똑같게 잘라 주세요.'; }

    if (spec.kind === 'weigh') { return '<em>' + spec.target + 'g</em>만큼 왼쪽부터 잘라 주세요.'; }
    if (spec.kind === 'irweigh') { return '두께가 다른 고기예요. 왼쪽부터 <em>' + spec.target + 'g</em>만큼!'; }
    if (spec.kind === 'three') { return '똑같이 <em>3팩</em>으로 소분! 가위 선 2개를 움직여요.'; }
    if (spec.kind === 'four') { return '똑같이 <em>4팩</em>으로 소분! 가위 선 3개를 움직여요.'; }
    if (spec.kind === 'five') { return '똑같이 <em>5팩</em>으로 소분! 가위 선 4개를 움직여요.'; }
    if (spec.kind === 'six') { return '손님 여섯 명! 똑같이 <em>6팩</em> 소분! 가위 선 5개!'; }

  }
  function bubbleText(spec) {
    if (spec.kind === 'half') { return '반띵! 딱 반으로 잘라 봐!'; }
    if (spec.kind === 'irhalf') { return '모양은 달라도 무게는 반반!'; }
    if (spec.kind === 'weigh') { return spec.target + 'g만큼만 쓱!'; }
    if (spec.kind === 'irweigh') { return '면적을 눈으로 재 봐!'; }
    if (spec.kind === 'six') { return '여섯 접시! 손이 바빠~'; }

  function errorOf(spec, w) {

  }

  function gradeOf(err) {

    if (err <= 5) { return { key: 'boss', label: '🔥 고깃집 사장님', mood: 'cheer' }; }
    if (err <= 10) { return { key: 'gold', label: '✨ 황금 눈대중', mood: 'aim' }; }
    return { key: 'pig', label: '🐷 조금만 더 꿀!', mood: 'sad' };
  }
  function starsFor(score) {
    if (score >= 4600) { return 3; }
    if (score >= 3800) { return 2; }
    if (score >= 2800) { return 1; }
    return 0;
  }
  function overallGrade(score) {
    if (score >= 4600) { return '👑 정육점 마스터'; }
    if (score >= 3800) { return '🔥 고깃집 사장님'; }
    if (score >= 2800) { return '✨ 황금 눈대중'; }
    return '🐷 조금만 더 꿀!';

  /* ---------- state ---------- */
  var S = {
    level: 1, levelDef: LEVELS[0], idx: 0, total: PROBLEMS, spec: null, prevKind: null,
    cuts: [], answer: [], active: 0, weights: null, err: null, points: 0, grade: null,
    score: 0, results: [], phase: 'play', stars: 0, newRecord: false,

  var save = { best: {}, muted: false, lastLevel: 1 };

    try { var raw = localStorage.getItem(STORE); if (raw) { return JSON.parse(raw) || {}; } } catch (e) {}
    return {};

  /* ---------- sound ---------- */
  var actx = null, audioUnlocked = false;
  function audio() {
    if (!audioUnlocked) { return null; }
    var A = window.AudioContext || window.webkitAudioContext;
    if (!A) { return null; }
    if (!actx) {
      try { actx = new A(); } catch (e) { return null; }
    }
    if (actx.state === 'suspended' && actx.resume) { actx.resume(); }

  function beep(freq, delay, dur, type, vol) {
    var c = audio(); if (!c) { return; }
    var t0 = c.currentTime + delay;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol === undefined ? 0.12 : vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    o.start(t0); o.stop(t0 + dur + 0.03);

  function sfx(kind) {
    if (save.muted || !audioUnlocked) { return; }
    if (kind === 'snip') {
      beep(1500, 0, 0.04, 'square', 0.07);
      beep(980, 0.05, 0.05, 'square', 0.07);
      beep(620, 0.11, 0.07, 'square', 0.05);
    } else if (kind === 'ding') {
      beep(1047, 0, 0.12, 'sine', 0.12); beep(1568, 0.1, 0.18, 'sine', 0.10);
    } else if (kind === 'sizzle') {
      beep(2400, 0, 0.03, 'sawtooth', 0.025);
      beep(1900, 0.04, 0.03, 'sawtooth', 0.022);
      beep(2600, 0.08, 0.03, 'sawtooth', 0.02);
    } else if (kind === 'no') {
      beep(360, 0, 0.13, 'sine', 0.11); beep(240, 0.11, 0.2, 'sine', 0.1);
    } else if (kind === 'tap') {
      beep(760, 0, 0.045, 'triangle', 0.05);
    } else if (kind === 'win') {

  /* ---------- drawing ---------- */
  function mx(f) { return MEAT_X0 + f * (MEAT_X1 - MEAT_X0); }

  function slabPath(spec, a, b) {
    var N = 24, i, x, t, bY, top = [], bot = [], d;
    for (i = 0; i <= N; i++) {
      x = a + (b - a) * i / N;
      t = MEAT_CY - halfH(spec, x);
      bY = MEAT_CY + halfH(spec, x);
      top.push([mx(x), t]);
      bot.push([mx(x), bY]);
    }
    d = 'M' + top[0][0].toFixed(1) + ' ' + top[0][1].toFixed(1);
    for (i = 1; i < top.length; i++) { d += ' L' + top[i][0].toFixed(1) + ' ' + top[i][1].toFixed(1); }
    for (i = bot.length - 1; i >= 0; i--) { d += ' L' + bot[i][0].toFixed(1) + ' ' + bot[i][1].toFixed(1); }
    return d + ' Z';
  }

  function edgeLine(spec, a, b, side, offset) {
    var N = 24, i, x, y, d = '';
    for (i = 0; i <= N; i++) {
      x = a + (b - a) * i / N;
      y = MEAT_CY + side * halfH(spec, x) + offset;
      d += (i ? ' L' : 'M') + mx(x).toFixed(1) + ' ' + y.toFixed(1);
    }
    return d;
  }

  function surfaceDetail(spec, a, b) {
    var out = [], i, k, x, t, bo, y, line, span = b - a;
    for (k = 0; k < 4; k++) {
      line = '';
      for (i = 0; i <= 18; i++) {
        x = a + span * i / 18;
        t = MEAT_CY - halfH(spec, x);
        bo = MEAT_CY + halfH(spec, x);
        y = t + (bo - t) * (0.18 + 0.19 * k) + Math.sin(x * 22 + k * 1.7) * 2.6;
        line += (i ? ' L' : 'M') + mx(x).toFixed(1) + ' ' + y.toFixed(1);
      }
      out.push('<path d="' + line + '" fill="none" stroke="#ffe6cd" stroke-width="2" opacity="' + (0.34 - k * 0.05).toFixed(2) + '" stroke-linecap="round"/>');
    }
    out.push('<path d="' + edgeLine(spec, a, b, -1, -1.6) + '" fill="none" stroke="#e7ab7a" stroke-width="3.4" opacity=".95" stroke-linecap="round"/>');
    out.push('<path d="' + edgeLine(spec, a, b, -1, 4.2) + '" fill="none" stroke="#ffeacd" stroke-width="4" opacity=".6" stroke-linecap="round"/>');
    out.push('<path d="' + edgeLine(spec, a, b, 1, 1.6) + '" fill="none" stroke="#e7ab7a" stroke-width="3.4" opacity=".95" stroke-linecap="round"/>');
    var marks = Math.max(2, Math.round(span * 9));
    for (i = 1; i < marks; i++) {
      x = a + span * (i / marks) + 0.004;
      t = MEAT_CY - halfH(spec, x);
      out.push('<path d="M' + mx(x).toFixed(1) + ' ' + (t + 6).toFixed(1) + ' l3.6 7" stroke="#c8425a" stroke-width="1.5" opacity=".38" stroke-linecap="round"/>');
    }
    return out.join('');
  }

  function renderBoard() {

    if (!spec) { box.innerHTML = ''; return; }
    n = spec.pieces;

    edges = [0];

    out.push('</defs>');
    out.push('<ellipse cx="180" cy="106" rx="172" ry="72" fill="url(#glowG)"/>');
    out.push('<rect x="6" y="30" width="' + (VB_W - 12) + '" height="' + (VB_H - 54) + '" rx="18" fill="url(#woodG)"/>');
    out.push('<rect x="6" y="30" width="' + (VB_W - 12) + '" height="' + (VB_H - 54) + '" rx="18" fill="none" stroke="#9a5f2b" stroke-width="2" opacity=".55"/>');
    for (i = 0; i < 5; i++) {

        out.push('<text x="' + cx.toFixed(1) + '" y="14" text-anchor="middle" font-size="15">✂️</text>');

  /* ---------- flow ---------- */
  function initialCuts(spec) {
    var ans = answerCuts(spec), cuts = [], i, up, down, room, dir, mag, shift;
    up = 95 - ans[ans.length - 1];
    down = ans[0] - MIN_GAP;
    room = Math.min(11, up, down);
    if (room < 4) { room = Math.min(up, down); }
    dir = rnd() < 0.5 ? -1 : 1;
    mag = Math.min(room, 5.5 + rnd() * 5.0);
    if (mag < 3.5) { mag = Math.min(room, 3.5); }
    shift = dir * mag;
    for (i = 0; i < ans.length; i++) {
      cuts.push(Math.round(clamp(ans[i] + shift, MIN_GAP, 100 - MIN_GAP) * 2) / 2);
    }
    for (i = 1; i < cuts.length; i++) {
      if (cuts[i] - cuts[i - 1] < MIN_GAP) { cuts[i] = Math.round((cuts[i - 1] + MIN_GAP) * 2) / 2; }
    }
    return cuts;
  }

    S.prevKind = spec.kind;
    S.cuts = initialCuts(spec);
    S.answer = answerCuts(spec);
    S.weights = null;
    S.err = null;
    S.points = 0;
    S.grade = null;
    S.active = 0;

    S.score = 0;

    S.prevKind = null;
    S.stars = 0;

    $('resultView').hidden = true;

    renderTabs();
    startProblem(0);
    renderHud();
    renderDots();
  }

  function boundsFor(i) {
    var cuts = S.cuts, lo = MIN_GAP, hi = 100 - MIN_GAP;

    return { lo: lo, hi: hi };
  }

  function moveCut(i, pct) {
    if (S.phase !== 'play' || i < 0 || i >= S.cuts.length) { return null; }
    var b = boundsFor(i);
    var p = clamp(pct, b.lo, b.hi);
    p = Math.round(p * 2) / 2;
    p = clamp(p, b.lo, b.hi);
    S.cuts[i] = p;
    renderBoard();
    syncControls();
    return p;
  }

  function selectCut(i) {
    if (i < 0 || i >= S.cuts.length) { return; }
    S.active = i;
    renderBoard();
    syncControls();
  }

  function nearestCut(pct) {
    var best = -1, bd = 1e9, i, d;
    for (i = 0; i < S.cuts.length; i++) {
      d = Math.abs(S.cuts[i] - pct);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  function cutNow() {
    if (S.phase !== 'play' || !S.spec) { return null; }
    var w = weightsFor(S.spec, S.cuts);
    S.weights = w;
    S.err = errorOf(S.spec, w);
    S.points = pointsOf(S.err);
    S.grade = gradeOf(S.err);
    S.phase = 'reveal';
    S.score += S.points;
    S.results.push({ kind: S.spec.kind, err: S.err, points: S.points, weights: w.slice(), total: S.spec.total, target: S.spec.target });
    $('cutBtn').disabled = true;
    renderHud();
    renderBoard();
    renderDots();
    renderReveal();
    setMood('chef', S.grade.mood);
    setMood('scissors', S.grade.mood === 'sad' ? 'sad' : 'cheer');
    sfx('snip');
    setTimeout(function () {
      if (S.grade.key === 'pig') { sfx('no'); } else { sfx('ding'); }
    }, 160);
    setTimeout(function () { sfx('sizzle'); }, 420);
    return { err: S.err, points: S.points, weights: w, grade: S.grade.key };
  }

  function nextProblem() {
    if (S.phase !== 'reveal') { return; }
    if (S.idx + 1 >= S.total) { finish(); return; }
    startProblem(S.idx + 1);
  }

  function finish() {
    var rec, prevStars = 0;
    if (S.phase === 'done') { return; }
    S.phase = 'done';
    S.stars = starsFor(S.score);
    rec = save.best[String(S.level)] || { score: 0, stars: 0 };
    prevStars = rec.stars || 0;
    S.newRecord = S.score > (rec.score || 0);
    if (S.newRecord) {
      save.best[String(S.level)] = { score: S.score, stars: Math.max(prevStars, S.stars) };
    } else if (S.stars > prevStars) {
      save.best[String(S.level)] = { score: rec.score, stars: S.stars };
    }
    writeStore();
    renderResult();
    renderTabs();
    setMood('chef', S.stars >= 2 ? 'cheer' : (S.stars === 1 ? 'aim' : 'sad'));
    sfx(S.stars >= 2 ? 'win' : 'ding');
  }

  /* ---------- sharing ---------- */
  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.hidden = false;
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { t.hidden = true; }, 2400);
  }
  function sharePayload() {
    return {
      title: TITLE,
      text: '통삼겹살을 눈대중으로 똑같이 소분하는 게임! 내 최고 점수는 ' + fmt(bestTotal()) + '점이에요.',
      url: (typeof location !== 'undefined' && location.href ? location.href.split('#')[0] : '')
    };
  }
  function bestTotal() {
    var k, v = 0;
    for (k in save.best) {
      if (save.best.hasOwnProperty(k) && save.best[k] && save.best[k].score > v) { v = save.best[k].score; }
    }
    return v;
  }
  function copyLink(url) {
    function done(ok) {
      toast(ok ? '링크를 복사했어요! 친구에게 붙여넣기 해 주세요.' : '주소창의 주소를 복사해 주세요: ' + url);
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = url;
      ta.setAttribute('readonly', 'readonly');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      if (ta.select) { ta.select(); }
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      done(ok);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { done(true); }, fallback);
        return;
      }
    } catch (e) {}
    fallback();
  }
  function shareGame() {
    var payload = sharePayload();
    if (navigator.share) {
      try {
        navigator.share(payload)['catch'](function () { copyLink(payload.url); });
        return;
      } catch (e) {}
    }
    copyLink(payload.url);
  }

  /* ---------- manifest ---------- */
  function setupManifest() {
    var link = $('manifestLink');
    var icon = document.querySelector ? document.querySelector('link[rel="apple-touch-icon"]') : null;
    var href = icon ? icon.getAttribute('href') : '';
    var mf = {
      name: TITLE, short_name: '정육왕',
      description: '통삼겹살을 눈대중으로 똑같이 소분하는 정육 놀이',
      start_url: '.', scope: '.', display: 'standalone', orientation: 'portrait',
      background_color: '#fff8f1', theme_color: '#ff7b47',
      icons: [{ src: href, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }]
    };
    try {
      link.setAttribute('href', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(mf)));
    } catch (e) {}
  }

  function applyMute() {
    $('sndOnIcon').style.display = save.muted ? 'none' : '';
    $('sndOffIcon').style.display = save.muted ? '' : 'none';
    $('sndBtn').className = 'iconbtn' + (save.muted ? ' off' : '');
    $('sndBtn').setAttribute('aria-label', save.muted ? '효과음 켜기' : '효과음 끄기');
  }

  /* ---------- pointer work on the board ---------- */
  function boardPct(e) {
    var el = $('board');
    if (!el || typeof el.getBoundingClientRect !== 'function') { return null; }
    var r = el.getBoundingClientRect();
    if (!r || !r.width) { return null; }
    var cx = (e && e.clientX !== undefined && e.clientX !== null) ? e.clientX
      : (e && e.touches && e.touches[0] ? e.touches[0].clientX : null);
    if (cx === null || cx === undefined) { return null; }
    var x0 = r.left + r.width * (MEAT_X0 / VB_W);
    var w = r.width * ((MEAT_X1 - MEAT_X0) / VB_W);
    return ((cx - x0) / w) * 100;
  }

  function bindBoard() {
    var el = $('board'), dragging = false;
    el.addEventListener('pointerdown', function (e) {
      if (S.phase !== 'play') { return; }
      var p = boardPct(e);
      if (p === null) { return; }
      var idx = nearestCut(p);
      if (idx < 0) { return; }
      dragging = true;
      selectCut(idx);
      moveCut(idx, p);
      if (e.preventDefault) { e.preventDefault(); }
    });
    el.addEventListener('pointermove', function (e) {
      if (!dragging || S.phase !== 'play') { return; }
      var p = boardPct(e);
      if (p === null) { return; }
      moveCut(S.active, p);
      if (e.preventDefault) { e.preventDefault(); }
    });
    function stop() { dragging = false; }
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointercancel', stop);
    el.addEventListener('pointerleave', stop);
    if (window.addEventListener) { window.addEventListener('pointerup', stop); }
  }

  /* ---------- events ---------- */
  function bind() {
    $('cutBtn').addEventListener('click', function () { cutNow(); });
    $('nextBtn').addEventListener('click', function () { sfx('tap'); nextProblem(); });
    $('retryBtn').addEventListener('click', function () { sfx('tap'); startLevel(S.level); });
    $('nextLevelBtn').addEventListener('click', function () {
      sfx('tap');
      startLevel(Math.min(LEVELS.length, S.level + 1));
    });
    $('shareBtn').addEventListener('click', shareGame);
    $('sndBtn').addEventListener('click', function () {
      audioUnlocked = true;
      save.muted = !save.muted;
      writeStore();
      applyMute();
      toast(save.muted ? '효과음을 껐어요' : '효과음을 켰어요');
      if (!save.muted) { sfx('tap'); }
    });
    $('fine').addEventListener('input', function (e) {
      var v = e && e.target ? parseFloat(e.target.value) : NaN;
      if (isNaN(v)) { return; }
      moveCut(S.active, v);
    });
    document.addEventListener('keydown', function (e) {
      if (!e || !e.key) { return; }
      var k = e.key;
      if (k === 'ArrowLeft' || k === 'ArrowRight') {
        if (S.phase !== 'play') { return; }
        var step = e.shiftKey ? 2 : 0.5;
        moveCut(S.active, S.cuts[S.active] + (k === 'ArrowRight' ? step : -step));
        if (e.preventDefault) { e.preventDefault(); }
        return;
      }
      if (k === 'Enter' || k === ' ' || k === 'Spacebar') {
        if (S.phase === 'play') { cutNow(); }
        else if (S.phase === 'reveal') { nextProblem(); }
        if (e.preventDefault) { e.preventDefault(); }
        return;
      }
      var n = parseInt(k, 10);
      if (n >= 1 && n <= 6 && n <= S.cuts.length) { selectCut(n - 1); }
    });
    document.addEventListener('pointerdown', function () { audioUnlocked = true; }, { once: true });
  }

  function init() {
    var stored = readStore();
    save.best = stored.best || {};
    save.muted = !!stored.muted;
    save.lastLevel = stored.lastLevel || 1;
    if (save.lastLevel < 1 || save.lastLevel > LEVELS.length) { save.lastLevel = 1; }
    seedRng((Date.now() ^ Math.floor(Math.random() * 4294967296)) >>> 0);
    applyMute();
    renderTabs();
    bind();
    bindBoard();
    setupManifest();
    startLevel(save.lastLevel);
  }

  /* ---------- test hook ---------- */
  window.__jeongyuk = {
    LEVELS: LEVELS, KINDS: KINDS, IRREG: IRREG, state: S, save: save,
    TITLE: TITLE, MIN_GAP: MIN_GAP, PROBLEMS: PROBLEMS, DMAX: DMAX,
    setSeed: seedRng, rnd: rnd,
    makeSpec: makeSpec, answerCuts: answerCuts, targetFrac: targetFrac,
    weightsFor: weightsFor, roundToTotal: roundToTotal, F: F, dens: dens,
    errorOf: errorOf, pointsOf: pointsOf, gradeOf: gradeOf, starsFor: starsFor,
    orderText: orderText, initialCuts: initialCuts,
    startLevel: startLevel, startProblem: startProblem, moveCut: moveCut,
    selectCut: selectCut, cutNow: cutNow, nextProblem: nextProblem, finish: finish,
    sharePayload: sharePayload, setMood: setMood,
    chips: function () { return S.chipEls; },
    tabs: function () { return S.tabEls; }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
